<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Meu Sonho de Infância - Contato</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="icone2.png">
        <link rel="stylesheet" type="text/css" href="style4.css">
        <script src="formcontato.js"></script>
    </head>
    <body>
        <header class="navbar" id="topo">
            <div class="logo">
                <img src="icone2.png" alt="Ícone Meu Sonho" class="icone-menu">
                <span>- Meu Sonho</span>
            </div>

            <nav class="nav-pag">
                <a href="index.html">O Sonho</a>
                <a href="hoje.html">Hoje</a>
                <a href="futuro.html">Futuro</a>
                <a href="contato.html" class="ativo">Contato</a>
            </nav>
        </header>

        <main> 
            <section class="contato">
                <div class="container-contato">
                    <h1 class="titulo-principal">O que você acha?</h1>
                    <p class="descricao-contato">
                        Depois de ver e analisar meu site, o que achou dele? Tem alguma sugestão? Preencha o formulário abaixo e me conte!
                    </p>
                </div>
            </section>

            <div class="form">
                <form name="formcontato" onsubmit="return processarform()" method="post">
                    <label>Nome:</label>
                    <input name="nome" type="text" placeholder="Seu nome completo">

                    <label>Nota:</label>
                    <select name="nota">
                        <option value=""></option>
                        <option>0</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>

                    <label>Sugestões:</label>
                    <textarea name="sugestao" rows="8" placeholder="Digite aqui o que você achou e uma sugestão."></textarea>

                    <div class="botoes">
                        <input name="enviar" type="submit" value="Enviar" id="Enviar">
                        <input type="reset" value="Limpar" id="Limpar">
                    </div>
                </form>
            </div>
        </main>

        <footer>
            <h5>Déborah Málaga 2026 &copy;Todos os direitos reservados<br> 
            Trabalho Acadêmico sem fins lucrativos</h5>
            <a href="#topo" class="seta-topo" title="Voltar ao topo">↑</a>
        </footer>
    </body>
</html>
